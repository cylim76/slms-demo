<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>装箱作业（Mobile）</title>

<style>
:root{
  --brand:#e0205c;
  --bg:#f1f2f5;
  --card:#fff;
  --text:#222;
  --muted:#777;
  --line:#e9e9e9;
  --ok:#16a34a;
  --bad:#ef4444;
}

/* ===== Reset ===== */
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Microsoft YaHei";
  background:var(--bg);
  color:var(--text);
}

/* ===== Topbar ===== */
.topbar{
  position:sticky;top:0;z-index:30;
  background:#fff;border-bottom:1px solid var(--line);
}
.topbar .line1{
  padding:10px 14px;
  display:flex;justify-content:space-between;align-items:center;
}
.title{font-size:16px;font-weight:1000}
.ver{
  cursor:pointer;
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  background:#f6f6f6;
  border:1px solid #eee;
  display:flex;gap:6px;align-items:center;
}
.ver .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}

/* ===== Layout ===== */
.wrap{
  padding:12px;
  max-width:1200px;
  margin:0 auto;
}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}
.cardHd{
  padding:10px 14px;
  border-bottom:1px solid var(--line);
  font-weight:1000;
}
.toolbar{
  display:flex;
  gap:8px;
  padding:10px 14px;
  border-bottom:1px solid var(--line);
  background:#fafafa;
  flex-wrap:wrap;
}
.btn{
  padding:8px 12px;
  border-radius:10px;
  border:1px solid #ddd;
  background:#fff;
  font-weight:900;
  cursor:pointer;
}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{background:#fff5f5;border-color:#ffd0d0;color:#b91c1c}
.btn.icon{width:36px;height:36px;padding:0;font-size:18px}

/* ===== Table Wrapper ===== */
.tableWrap{
  position:relative;
  overflow:auto;
  max-height:calc(100vh - 260px);
  background:#fff;
}

/* ===== Table ===== */
table{
  border-collapse:separate;
  border-spacing:0;
  min-width:980px;
  width:100%;
}
thead th{
  position:sticky;
  top:0;
  z-index:5;
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:10px;
  font-size:12px;
  font-weight:1000;
  color:var(--muted);
}
tbody td{
  border-bottom:1px solid #f2f2f2;
  padding:8px 10px;
}
tbody tr.selected{
  background:#fff2f7;
  outline:2px solid rgba(224,32,92,.22);
  outline-offset:-2px;
}

/* ===== Frozen Columns ===== */
.th-sign,.td-sign{
  position:sticky;
  left:0;
  z-index:10;
  background:#fff;
}
.th-action,.td-action{
  position:sticky;
  left:64px;
  z-index:10;
  background:#fff;
}
.th-photo,.td-photo{
  position:sticky;
  right:0;
  z-index:10;
  background:#fff;
  min-width:220px;
}

/* ===== Cells ===== */
.signBtn{
  width:44px;height:36px;
  border-radius:10px;
  border:1px solid #ddd;
  display:flex;align-items:center;justify-content:center;
  font-weight:1000;font-size:16px;
  cursor:pointer;
}
.signBtn.plus{color:var(--ok);background:#f5fff8;border-color:#cfeedd}
.signBtn.minus{color:var(--bad);background:#fff5f5;border-color:#ffd0d0}

input{
  width:100%;
  border:1px solid #ddd;
  border-radius:8px;
  padding:7px 8px;
  font-size:13px;
}
input:focus{
  outline:none;
  border-color:#c7c7c7;
  box-shadow:0 0 0 3px rgba(224,32,92,.12);
}

/* ===== Photos ===== */
.photoStrip{
  display:flex;
  gap:6px;
  max-width:240px;
  overflow-x:auto;
}
.thumb{
  width:36px;height:36px;
  border-radius:10px;
  border:1px solid #eee;
  overflow:hidden;
  cursor:pointer;
}
.thumb img{width:100%;height:100%;object-fit:cover}

/* ===== Utils ===== */
.muted{color:var(--muted);font-size:12px}
</style>
</head>

<body>

<div class="topbar">
  <div class="line1">
    <div class="title">装箱作业（明细）</div>
    <div class="ver">
      <span class="dot"></span>
      <span>stuffing-mobile-v6-freeze</span>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <div class="cardHd">装箱动作明细</div>

    <div class="toolbar">
      <button class="btn primary" onclick="addAction()">+动作</button>
      <button class="btn" id="btnAddModel" onclick="addModelToSelected()" disabled>+型号</button>
      <button class="btn danger" id="btnDelete" onclick="deleteSelectedModel()" disabled>删除</button>
      <button class="btn icon" id="btnPhoto" onclick="pickPhotoForSelected()" disabled>📷</button>
    </div>

    <div class="tableWrap" id="listWrap"></div>
  </div>
</div>

<script>
/* =====================
 * 数据结构
 * ===================== */
let seq=1;
let actions=[];
let selection=null;

function uid(){return 'A'+Date.now().toString(36)+'-'+(seq++)}
function createModel(){return{model:'',w:'',l:'',h:'',f:''}}
function createAction(){
  return{ id:uid(), sign:+1, models:[createModel()], photos:[] }
}

/* 初始 */
actions=[createAction(),createAction()];
renderTable();

/* =====================
 * Selection（主线）
 * ===================== */
function setSelection(actionId,modelIdx){
  selection={actionId,modelIdx};
  updateToolbar();
  highlight();
}
function clearSelection(){
  selection=null;
  updateToolbar();
  highlight();
}
function highlight(){
  document.querySelectorAll('#listWrap tbody tr').forEach(tr=>{
    const a=tr.dataset.actionId;
    const m=Number(tr.dataset.modelIdx);
    tr.classList.toggle('selected',
      selection && selection.actionId===a && selection.modelIdx===m);
  });
}
function updateToolbar(){
  const ok=!!selection;
  btnAddModel.disabled=!ok;
  btnDelete.disabled=!ok;
  btnPhoto.disabled=!ok;
}

/* =====================
 * Render
 * ===================== */
function renderTable(){
  const wrap=document.getElementById('listWrap');
  wrap.innerHTML=tableTpl();
  highlight();
}
function tableTpl(){
  let rows=[];
  actions.forEach((a,ai)=>{
    a.models.forEach((m,mi)=>{
      const first=mi===0;
      rows.push(`
<tr data-action-id="${a.id}" data-model-idx="${mi}"
 onclick="setSelection('${a.id}',${mi})">

${first?`
<td rowspan="${a.models.length}" class="td-sign">
  <div class="signBtn ${a.sign===1?'plus':'minus'}"
    onclick="event.stopPropagation();toggleSign('${a.id}')">
    ${a.sign===1?'+':'−'}
  </div>
</td>`:''}

${first?`
<td rowspan="${a.models.length}" class="td-action">#${ai+1}</td>`:''}

<td><input value="${m.model}" placeholder="型号"
 onclick="event.stopPropagation()"
 oninput="m.model=this.value"></td>

<td><input value="${m.w}" placeholder="W"
 onclick="event.stopPropagation()"
 oninput="m.w=this.value"></td>

<td><input value="${m.l}" placeholder="L"
 onclick="event.stopPropagation()"
 oninput="m.l=this.value"></td>

<td><input value="${m.h}" placeholder="H"
 onclick="event.stopPropagation()"
 oninput="m.h=this.value"></td>

<td><input value="${m.f}" placeholder="F"
 onclick="event.stopPropagation()"
 oninput="m.f=this.value"></td>

${first?`
<td rowspan="${a.models.length}" class="td-photo">
  ${photoTpl(a)}
</td>`:''}

</tr>`);
    });
  });

  return `
<table>
<thead>
<tr>
<th class="th-sign">±</th>
<th class="th-action">动作</th>
<th>型号</th>
<th>W</th>
<th>L</th>
<th>H</th>
<th>F</th>
<th class="th-photo">照片</th>
</tr>
</thead>
<tbody>
${rows.join('')||'<tr><td colspan="8" class="muted">暂无</td></tr>'}
</tbody>
</table>`;
}

/* =====================
 * 操作
 * ===================== */
function addAction(){
  actions.push(createAction());
  renderTable();
}
function addModelToSelected(){
  if(!selection)return;
  const a=actions.find(x=>x.id===selection.actionId);
  if(!a)return;
  a.models.push(createModel());
  selection.modelIdx=a.models.length-1;
  renderTable();
}
function deleteSelectedModel(){
  if(!selection)return;
  const ai=actions.findIndex(a=>a.id===selection.actionId);
  const a=actions[ai];
  if(!confirm('确认删除该型号行？'))return;
  a.models.splice(selection.modelIdx,1);
  if(a.models.length===0){
    actions.splice(ai,1);
    selection=null;
  }
  renderTable();
}
function toggleSign(id){
  const a=actions.find(x=>x.id===id);
  if(a){a.sign=a.sign===1?-1:1;renderTable();}
}
function pickPhotoForSelected(){
  if(!selection)return;
  const a=actions.find(x=>x.id===selection.actionId);
  const i=document.createElement('input');
  i.type='file';i.accept='image/*';
  i.onchange=()=>{
    const f=i.files[0];
    const r=new FileReader();
    r.onload=()=>{a.photos.push(r.result);renderTable()};
    r.readAsDataURL(f);
  };
  i.click();
}
function photoTpl(a){
  if(!a.photos.length)return'<span class="muted">暂无</span>';
  return `
<div class="photoStrip">
${a.photos.map(p=>`
<div class="thumb"><img src="${p}"></div>`).join('')}
</div>`;
}
</script>

</body>
</html>
