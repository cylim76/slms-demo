<!--
File: mobile/stuffing-mobile.html
Version: stuffing-mobile-v5
Date: 2025-12-29

v5 变更点（基于 v4 最新主线）：
1) 增加“第一页：选择作业地”
   - 顶部：作业地下拉 + 右侧【下一步】按钮
   - 下方：该作业地已安排箱号列表（模拟 20 条）
     字段：计划装箱时间 / 船公司 / 箱号 / 箱型 / 型号 / 数量 / 状态（等待/进行中/已完成）
   - 列表右侧自动纵向滚动条；表头固定；选中行高亮
2) 点击【下一步】进入“第二页：装箱作业（v4 列表明细页）”
   - 作业信息区新增：Booking No、截关时间（Cutoff）
   - 作业信息区改为可折叠：
     * 折叠后仅显示：箱号、抱夹车号、司机、装卸工
   - 从第一页带入：作业地、箱号、船公司、箱型、(可选)型号/数量（仅用于显示，不强制写入明细）
   - 进入第二页时清空人员相关字段（抱夹/司机/装卸工/监装等，便于同箱不同人员）
3) 保留 v4 全部逻辑：
   - 动作/型号明细使用表格列表，表头 sticky，列表溢出滚动
   - 工具栏：+动作 / +型号 / 删除 / 📷（作用于选中行所属动作）
   - 删除规则：按“型号行”删除；动作无型号则动作一并删除
   - 照片：缩略图点击预览；预览支持左右滑动浏览；右上角删除（确认后删除）
4) 三件套规则保留（SLMS-ThreeKitStyle）：右上角版本号，点击弹出 schema/dict/ui-spec；内容超出自动滚动
-->

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>装箱作业（Mobile）</title>
<style>
:root{
  --brand:#e0205c;--bg:#f1f2f5;--card:#fff;--text:#222;--muted:#6d6d6d;--line:#e9e9e9;
  --ok:#16a34a;--bad:#ef4444;--warn:#f59e0b;--done:#0ea5e9;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Microsoft YaHei";background:var(--bg);color:var(--text)}
button,input,select,textarea{font-family:inherit}
.small{font-size:12px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hidden{display:none}

/* ===== 顶部：标题行 + 工具行 ===== */
.topbar{
  position:sticky;top:0;z-index:20;
  background:#fff;border-bottom:1px solid var(--line);
}
.topbar .line1{
  padding:10px 12px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.title{font-weight:1000;font-size:16px}
.subnote{font-size:12px;color:var(--muted)}
.topbar .line2{
  padding:0 12px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}

/* 右上角版本号 */
.ver{
  cursor:pointer;background:#f6f6f6;border:1px solid #eee;border-radius:999px;
  padding:6px 10px;font-size:12px;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  display:flex;align-items:center;gap:6px;
}
.ver .dot{width:8px;height:8px;border-radius:99px;background:var(--brand)}

/* 按钮 */
.btn{
  border:1px solid #ddd;background:#fff;border-radius:12px;padding:10px 12px;
  font-weight:900;font-size:13px;cursor:pointer;white-space:nowrap
}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{background:#fafafa}
.btn.danger{background:#fff7f7;border-color:#ffd3d3;color:#b91c1c}
.btn.small{font-size:12px;padding:7px 10px;border-radius:10px}
.btn.icon{
  width:36px;height:36px;padding:0;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:1000
}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active{transform:translateY(1px)}

/* 页面容器 */
.wrap{padding:12px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 10px 24px rgba(0,0,0,.06);
  overflow:hidden
}
.cardHd{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.cardHd b{font-size:13px}
.cardBd{padding:12px}

/* 作业信息输入 */
.formGrid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
@media (max-width:560px){
  .formGrid{grid-template-columns:1fr}
}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12px;color:var(--muted);font-weight:900}
.fld input,.fld select{
  border:1px solid #ddd;border-radius:12px;padding:10px 10px;font-size:13px;outline:none;background:#fff
}
.fld input:focus,.fld select:focus{border-color:#c7c7c7;box-shadow:0 0 0 3px rgba(224,32,92,.10)}

/* 折叠信息条 */
.collapseBar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;border-top:1px solid var(--line);background:#fafafa;
}
.miniInfo{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:12px;font-weight:900;color:#333;
}
.pill{
  border:1px solid #eee;background:#fff;border-radius:999px;padding:6px 10px;
}

/* 列表工具栏 */
.toolbar{
  padding:10px 12px;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:#fafafa;
}
.toolbar .left, .toolbar .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hintPill{
  font-size:12px;font-weight:900;color:var(--muted);
  border:1px solid #eee;background:#fff;border-radius:999px;padding:6px 10px;
}

/* 列表滚动容器：默认规则 */
.listWrap{
  overflow:auto; /* ✅ 自动纵向滚动；宽表支持横向滚动 */
  border-top:1px solid var(--line);
}

/* 表格（通用） */
table{border-collapse:separate;border-spacing:0;width:100%;background:#fff}
thead th{
  position:sticky;top:0;z-index:5;
  background:#fff;
  border-bottom:1px solid #eee;
  font-size:12px;color:var(--muted);font-weight:1000;
  text-align:left;padding:10px 10px;
}
tbody td{
  border-bottom:1px solid #f2f2f2;
  padding:8px 10px;
  vertical-align:middle;
}
tbody tr:hover{background:#fafafa}
tbody tr.selected{
  background:#fff2f7;
  outline:2px solid rgba(224,32,92,.22);
  outline-offset:-2px;
}

/* 第二页明细表：加最小宽，支持横向滚动 */
.tableMinW{min-width:920px}

/* ± */
.cellSign{width:58px}
.signBtn{
  width:44px;height:36px;border-radius:12px;border:1px solid #ddd;background:#fff;
  font-weight:1000;font-size:16px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  user-select:none;
}
.signBtn.plus{color:var(--ok);border-color:#cfeedd;background:#f5fff8}
.signBtn.minus{color:var(--bad);border-color:#ffd3d3;background:#fff7f7}
.cellAction{width:70px;color:#444;font-weight:900}
td input{
  width:100%;border:1px solid #ddd;border-radius:10px;padding:8px 9px;font-size:13px;outline:none;background:#fff
}
td input:focus{border-color:#c7c7c7;box-shadow:0 0 0 3px rgba(224,32,92,.10)}

/* 照片缩略图列（同一动作共享） */
.photoStrip{
  display:flex;align-items:center;gap:6px;
  max-width:420px;
  overflow:auto; /* ✅ 照片多时可横向滚动 */
  padding-bottom:2px;
}
.thumbMini{
  width:34px;height:34px;border-radius:12px;border:1px solid #eee;background:#fafafa;
  overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex:0 0 auto;
}
.thumbMini img{width:100%;height:100%;object-fit:cover;display:block}

/* 状态标签（第一页列表用） */
.tag{
  font-size:12px;font-weight:1000;border-radius:999px;padding:6px 10px;border:1px solid #eee;background:#fff;
}
.tag.wait{border-color:#ffe2b8;background:#fff7e8;color:#9a5b00}
.tag.run{border-color:#bfe8ff;background:#eef8ff;color:#0369a1}
.tag.done{border-color:#bfead7;background:#f1fff8;color:#0f766e}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  background:rgba(0,0,0,.82);color:#fff;padding:10px 12px;border-radius:999px;
  font-size:12px;font-weight:900;display:none;z-index:99999
}

/* ===== 照片预览层 ===== */
.viewerMask{
  position:fixed;inset:0;background:rgba(0,0,0,.78);
  display:none;align-items:center;justify-content:center;z-index:99998;
}
.viewer{
  width:min(96vw,720px);
  height:min(86vh,820px);
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
.viewer img{
  max-width:100%;max-height:100%;
  border-radius:14px;
  box-shadow:0 18px 60px rgba(0,0,0,.5);
}
.viewerTop{
  position:absolute;top:10px;left:10px;right:10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.viewerPill{
  background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.18);
  border-radius:999px;padding:7px 10px;font-size:12px;font-weight:1000;
}
.viewerBtn{
  border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.55);
  color:#fff;border-radius:12px;padding:8px 10px;font-weight:1000;font-size:12px;cursor:pointer;
}
.viewerBtn.danger{border-color:rgba(255,120,120,.35);background:rgba(120,0,0,.35)}
.viewerNav{
  position:absolute;left:10px;right:10px;bottom:10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.navIcon{
  width:42px;height:38px;border-radius:12px;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.55);
  color:#fff;font-weight:1000;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  user-select:none;
}
.navIcon:active{transform:translateY(1px)}

/* ===== 三件套（SLMS-ThreeKitStyle）弹窗 ===== */
.modalMask{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;z-index:9999}
.modal{
  width:980px;max-width:96vw;height:78vh;
  background:#fff;border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.35);
  display:flex;flex-direction:column;overflow:hidden
}
.modalHd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.modalHd b{font-size:14px}
.modalBody{flex:1;display:flex;min-height:0}
.leftNav{
  width:220px;border-right:1px solid var(--line);background:#fafafa;
  padding:10px;display:flex;flex-direction:column;gap:8px
}
.navBtn{
  width:100%;text-align:left;
  border:1px solid #e5e5e5;background:#fff;border-radius:12px;
  padding:10px 10px;font-weight:1000;font-size:12px;cursor:pointer
}
.navBtn.active{border-color:var(--brand);color:var(--brand)}
.rightDoc{
  flex:1;min-width:0;padding:12px;display:flex;flex-direction:column;gap:10px;
  overflow:auto; /* ✅ 右侧内容区优先纵向滚动 */
}
.docCard{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.docHd{
  padding:10px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:#fafafa
}
.docHd .name{font-weight:1000;font-size:12px}
.copyBtn{
  border:1px solid #ddd;background:#fff;border-radius:10px;padding:7px 10px;
  font-weight:900;font-size:12px;cursor:pointer
}
pre{
  margin:0;padding:12px;max-width:100%;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;
  overflow:auto;white-space:pre;
}
</style>
</head>

<body>
  <div class="topbar">
    <div class="line1">
      <div>
        <div class="title" id="pageTitle">装箱作业（选择作业地）</div>
        <div class="subnote" id="pageNote">先选择作业地与箱号，再进入装箱动作明细页</div>
      </div>
      <div class="ver" id="verBtn" title="点击查看三件套（schema/dict/ui-spec）">
        <span class="dot"></span>
        <span>stuffing-mobile-v5</span>
      </div>
    </div>

    <div class="line2">
      <div class="row">
        <span class="hintPill">时间：<span id="nowTime"></span></span>
        <span class="hintPill" id="selBoxHint">已选箱：<span id="selBoxText">无</span></span>
        <span class="hintPill hidden" id="selHintWrap">选中行：<span id="selHint">无</span></span>
      </div>
      <div class="row">
        <button class="btn ghost hidden" id="btnBack" onclick="goPage1()">← 返回</button>
      </div>
    </div>
  </div>

  <div class="wrap">

    <!-- ========== Page 1：选择作业地 ========== -->
    <div class="card" id="page1">
      <div class="cardHd">
        <b>选择作业地</b>
        <div class="row">
          <select id="placeSel" class="btn" style="padding:10px 12px; border-radius:12px; font-weight:900">
            <!-- options via JS -->
          </select>
          <button class="btn primary" id="btnNext" onclick="goPage2()">下一步</button>
        </div>
      </div>

      <div class="cardBd">
        <div class="muted small" style="margin-bottom:8px">
          下方列表为：当前已安排在该作业地的箱号（模拟 20 条）。请选择一条后点击【下一步】。
        </div>
      </div>

      <div class="listWrap" id="planListWrap" style="max-height:calc(100vh - 260px)"></div>
    </div>

    <!-- ========== Page 2：装箱作业（明细） ========== -->
    <div class="card hidden" id="page2">

      <div class="cardHd">
        <b>作业信息</b>
        <span class="muted small">进入页面默认清空人员字段（同箱不同人员可重填）</span>
      </div>

      <!-- 折叠条 -->
      <div class="collapseBar">
        <div class="miniInfo" id="miniInfo"></div>
        <button class="btn small" id="btnToggleJob" onclick="toggleJobInfo()">折叠</button>
      </div>

      <div class="cardBd" id="jobInfoBody">
        <div class="formGrid">
          <div class="fld"><label>作业地（stuffing_place）</label><input id="f_place" placeholder="如 012_A3平台" value=""/></div>
          <div class="fld"><label>箱号（container_no）</label><input id="f_container_no" placeholder="如 TGBU1234567" value=""/></div>

          <div class="fld"><label>船公司（carrier）</label><input id="f_carrier" placeholder="如 MAEU / COSCO" value=""/></div>
          <div class="fld"><label>箱型（container_type）</label><input id="f_container_type" placeholder="如 40HQ / 45HQ" value=""/></div>

          <div class="fld"><label>Booking No</label><input id="f_booking_no" placeholder="如 BK20251229-001" value=""/></div>
          <div class="fld"><label>截关时间（Cutoff）</label><input id="f_cutoff" placeholder="如 2025-12-31 18:00" value=""/></div>

          <div class="fld"><label>运输公司（trans_co）</label><input id="f_trans_co" placeholder="如 XX运输" value=""/></div>
          <div class="fld"><label>抱夹车号（clamp_no）</label><input id="f_clamp_no" placeholder="如 CL-08" value=""/></div>

          <div class="fld"><label>司机（driver）</label><input id="f_driver" placeholder="姓名/工号" value=""/></div>
          <div class="fld"><label>装卸工（loader）</label><input id="f_loader" placeholder="姓名/工号" value=""/></div>

          <div class="fld"><label>监装（inspector）</label><input id="f_inspector" placeholder="姓名/工号" value=""/></div>
          <div class="fld"><label>备注（可选）</label><input id="f_note" placeholder="可留空" value=""/></div>
        </div>
      </div>

      <!-- 工具栏（作用于选中行/所属动作） -->
      <div class="toolbar">
        <div class="left">
          <button class="btn primary" onclick="addAction()">+动作</button>
          <button class="btn ghost" id="btnAddModel" onclick="addModelToSelected()" disabled>+型号</button>
          <button class="btn danger" id="btnDelete" onclick="deleteSelectedModel()" disabled>删除</button>
          <button class="btn icon ghost" id="btnPhoto" title="拍照/上传（作用于选中动作）" onclick="pickPhotoForSelected()" disabled>📷</button>
        </div>
        <div class="right">
          <span class="muted small">删除按“型号行”执行；若删除后动作无型号，动作一并删除</span>
        </div>
      </div>

      <!-- 明细列表 -->
      <div class="listWrap" id="listWrap" style="max-height:calc(100vh - 520px)"></div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <!-- 照片预览层 -->
  <div class="viewerMask" id="viewerMask">
    <div class="viewer" id="viewer">
      <div class="viewerTop">
        <span class="viewerPill" id="viewerMeta">0/0</span>
        <button class="viewerBtn danger" id="viewerDelBtn" onclick="deleteViewedPhoto()">删除</button>
      </div>

      <img id="viewerImg" alt="preview"/>

      <div class="viewerNav">
        <div class="navIcon" onclick="prevPhoto()">‹</div>
        <span class="viewerPill" id="viewerHint">左右滑动浏览</span>
        <div class="navIcon" onclick="nextPhoto()">›</div>
      </div>
    </div>
  </div>

  <!-- 三件套弹窗（SLMS-ThreeKitStyle） -->
  <div class="modalMask" id="kitMask">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalHd">
        <b>三件套（Schema / Data Dict / UI Spec）— stuffing-mobile-v5</b>
        <button class="btn small" onclick="closeKit()">关闭</button>
      </div>

      <div class="modalBody">
        <div class="leftNav">
          <button class="navBtn active" id="btnSchema" onclick="showDoc('schema')">slms-schema.yaml</button>
          <button class="navBtn" id="btnDict" onclick="showDoc('dict')">slms-data-dict.md</button>
          <button class="navBtn" id="btnUi" onclick="showDoc('ui')">slms-ui-spec.md</button>
        </div>

        <div class="rightDoc" id="docRight"></div>
      </div>
    </div>
  </div>

<script>
/** ==========================
 *  Page 状态
 * ========================== */
let currentPage = 1; // 1=选择作业地, 2=装箱作业
const pageTitle = document.getElementById('pageTitle');
const pageNote  = document.getElementById('pageNote');
const btnBack   = document.getElementById('btnBack');
const selHintWrap = document.getElementById('selHintWrap');

/** ==========================
 *  作业地 & 箱号计划（模拟）
 * ========================== */
const PLACES = [
  '011_A3仓库','012_A3平台','021_B1东侧','022_B1西侧','031_B2仓库','041_B3东侧','042_B3西侧','061_C2南侧','071_外部'
];

let selectedPlace = PLACES[0];
let planRows = [];           // 当前作业地下的 20 条箱计划
let selectedPlanIdx = -1;    // 选中的箱计划行

function genPlanRows(place){
  // 模拟 20 条
  const carriers = ['MAEU','COSCO','MSCU','ONE','HPL','YML'];
  const cTypes = ['40HQ','45HQ','20GP'];
  const models = ['A1','B2','C3','D4','E5','X9'];
  const statuses = ['等待','进行中','已完成'];
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  const pad = n => String(n).padStart(2,'0');

  const baseDay = 29; // 12-29
  const rows = [];
  for(let i=0;i<20;i++){
    const hh = 8 + (i%10);
    const mm = (i%2)*30;
    const st = (i%7===0) ? '已完成' : (i%5===0 ? '进行中' : '等待');

    const carrier = pick(carriers);
    const cn = `${carrier}${(1000000+i*73).toString().slice(0,7)}${pad(i%97)}`.slice(0,11).toUpperCase(); // 伪箱号
    const containerNo = `TGBU${(1234500 + i*17).toString().slice(0,7)}`.slice(0,11) + (i%10); // 伪箱号

    rows.push({
      place,
      plan_time:`2025-12-${baseDay} ${pad(hh)}:${pad(mm)}`,
      carrier,
      container_no:containerNo,
      container_type:pick(cTypes),
      model:pick(models),
      qty: 10 + (i%6)*5,
      status:st,
      booking_no:`BK20251229-${pad(i+1)}`,
      cutoff:`2025-12-31 18:00`,
      trans_co: (i%3===0) ? 'XX运输' : (i%3===1 ? 'YY物流' : 'ZZ车队')
    });
  }
  return rows;
}

/** ==========================
 *  明细数据结构（v4 继承）
 * ========================== */
let actions = [];
let seq = 1;
let selection = null;

/** 作业信息（进入明细页默认清空人员字段） */
const jobInfo = {
  place:'', container_no:'', carrier:'', container_type:'',
  booking_no:'', cutoff:'',
  trans_co:'', clamp_no:'', driver:'', loader:'', inspector:'',
  note:''
};

function uid(){ return 'A' + Date.now().toString(36) + '-' + (seq++); }
function nowStr(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function createEmptyModelRow(){ return { model:'', w:'', l:'', h:'', f:'' }; }
function createEmptyAction(){
  return { id:uid(), sign:+1, models:[createEmptyModelRow()], photos:[], ts:Date.now() };
}

/** ==========================
 *  初始化
 * ========================== */
function init(){
  document.getElementById('nowTime').textContent = nowStr();

  // Page1: place 下拉
  const placeSel = document.getElementById('placeSel');
  placeSel.innerHTML = PLACES.map(p=>`<option value="${escAttr(p)}">${esc(p)}</option>`).join('');
  placeSel.value = selectedPlace;
  placeSel.onchange = ()=>{
    selectedPlace = placeSel.value;
    selectedPlanIdx = -1;
    planRows = genPlanRows(selectedPlace);
    renderPlanList();
    setSelectedBoxHint();
  };

  // 默认生成第一页数据
  planRows = genPlanRows(selectedPlace);
  renderPlanList();
  setSelectedBoxHint();

  // 预置明细：默认 2 条空白动作（进入第二页时再重置）
  actions = [createEmptyAction(), createEmptyAction()];
  selection = null;
  updateToolbarState();
  renderSelectionHint();

  // 三件套
  verBtnInit();
}

/** ==========================
 *  Page 切换
 * ========================== */
function goPage1(){
  currentPage = 1;
  document.getElementById('page1').classList.remove('hidden');
  document.getElementById('page2').classList.add('hidden');
  btnBack.classList.add('hidden');
  selHintWrap.classList.add('hidden');

  pageTitle.textContent = '装箱作业（选择作业地）';
  pageNote.textContent  = '先选择作业地与箱号，再进入装箱动作明细页';
}

function goPage2(){
  if(selectedPlanIdx<0){
    toast('请先在列表中选择一个箱号');
    return;
  }
  const picked = planRows[selectedPlanIdx];
  if(!picked){
    toast('选择无效，请重选');
    return;
  }

  // 从计划带入作业信息：place/container/carrier/type/booking/cutoff/trans_co
  jobInfo.place = picked.place;
  jobInfo.container_no = picked.container_no;
  jobInfo.carrier = picked.carrier;
  jobInfo.container_type = picked.container_type;
  jobInfo.booking_no = picked.booking_no || '';
  jobInfo.cutoff = picked.cutoff || '';
  jobInfo.trans_co = picked.trans_co || '';

  // ✅ 进入第二页：清空人员字段（可能同箱不同人员）
  jobInfo.clamp_no = '';
  jobInfo.driver = '';
  jobInfo.loader = '';
  jobInfo.inspector = '';
  jobInfo.note = '';

  // 明细动作：默认 2 条空白动作
  actions = [createEmptyAction(), createEmptyAction()];
  selection = null;

  currentPage = 2;
  document.getElementById('page1').classList.add('hidden');
  document.getElementById('page2').classList.remove('hidden');
  btnBack.classList.remove('hidden');
  selHintWrap.classList.remove('hidden');

  pageTitle.textContent = '装箱作业（明细）';
  pageNote.textContent  = '表格仅展示明细；操作作用于选中行；照片点击预览（可左右滑动）';

  // 默认展开作业信息
  jobCollapsed = false;
  syncJobCollapseUI();

  // 绑定输入
  setJobInputsFromState(false);

  // 渲染明细
  render();
  updateMiniInfo();
  setSelectedBoxHint();
}

function setSelectedBoxHint(){
  const el = document.getElementById('selBoxText');
  if(selectedPlanIdx<0 || !planRows[selectedPlanIdx]) el.textContent = '无';
  else{
    const r = planRows[selectedPlanIdx];
    el.textContent = `${r.container_no} / ${r.place}`;
  }
}

/** ==========================
 *  Page1：计划列表渲染（20条）
 * ========================== */
function renderPlanList(){
  const wrap = document.getElementById('planListWrap');
  const rows = planRows.map((r, idx)=>{
    const sel = (idx===selectedPlanIdx) ? 'selected' : '';
    const tagCls = r.status==='等待' ? 'tag wait' : (r.status==='进行中' ? 'tag run' : 'tag done');
    return `
      <tr class="${sel}" onclick="selectPlanRow(${idx})">
        <td style="width:150px">${esc(r.plan_time)}</td>
        <td style="width:80px;font-weight:1000">${esc(r.carrier)}</td>
        <td style="width:150px;font-family:ui-monospace,Menlo,Consolas,monospace">${esc(r.container_no)}</td>
        <td style="width:80px">${esc(r.container_type)}</td>
        <td style="width:80px">${esc(r.model)}</td>
        <td style="width:80px">${esc(r.qty)}</td>
        <td style="width:110px"><span class="${tagCls}">${esc(r.status)}</span></td>
      </tr>
    `;
  }).join('');

  wrap.innerHTML = `
    <div class="listWrap" style="max-height:calc(100vh - 260px);overflow:auto">
      <table>
        <thead>
          <tr>
            <th style="width:150px">计划装箱时间</th>
            <th style="width:80px">船公司</th>
            <th style="width:150px">箱号</th>
            <th style="width:80px">箱型</th>
            <th style="width:80px">型号</th>
            <th style="width:80px">数量</th>
            <th style="width:110px">状态</th>
          </tr>
        </thead>
        <tbody>
          ${rows || `<tr><td colspan="7" class="muted" style="padding:16px">暂无数据</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

function selectPlanRow(idx){
  selectedPlanIdx = idx;
  renderPlanList();
  setSelectedBoxHint();
}

/** ==========================
 *  Page2：作业信息（折叠）
 * ========================== */
let jobCollapsed = false;
function toggleJobInfo(){
  jobCollapsed = !jobCollapsed;
  syncJobCollapseUI();
}
function syncJobCollapseUI(){
  const body = document.getElementById('jobInfoBody');
  const btn  = document.getElementById('btnToggleJob');
  if(jobCollapsed){
    body.classList.add('hidden');
    btn.textContent = '展开';
  }else{
    body.classList.remove('hidden');
    btn.textContent = '折叠';
  }
  updateMiniInfo();
}
function updateMiniInfo(){
  const mini = document.getElementById('miniInfo');
  // 折叠后仅要求显示：箱号、抱夹车号、司机、装卸工
  const items = [
    {k:'箱号', v: jobInfo.container_no},
    {k:'抱夹', v: jobInfo.clamp_no},
    {k:'司机', v: jobInfo.driver},
    {k:'装卸工', v: jobInfo.loader},
  ];
  mini.innerHTML = items.map(it=>`<span class="pill">${esc(it.k)}：${esc(it.v||'')}</span>`).join('');
}

/** === 作业信息：输入绑定 === */
function setJobInputsFromState(forceClear){
  const map = {
    f_place:'place',
    f_container_no:'container_no',
    f_carrier:'carrier',
    f_container_type:'container_type',
    f_booking_no:'booking_no',
    f_cutoff:'cutoff',
    f_trans_co:'trans_co',
    f_clamp_no:'clamp_no',
    f_driver:'driver',
    f_loader:'loader',
    f_inspector:'inspector',
    f_note:'note'
  };
  Object.entries(map).forEach(([id,key])=>{
    const el=document.getElementById(id);
    if(!el) return;
    if(forceClear) jobInfo[key]='';
    el.value = jobInfo[key] || '';
    el.oninput = ()=>{
      jobInfo[key]=el.value;
      updateMiniInfo();
    };
  });
}

/** ==========================
 *  Page2：选中处理（型号行）
 * ========================== */
function setSelection(actionId, modelIdx){
  selection = { actionId, modelIdx };
  updateToolbarState();
  renderSelectionHint();
  renderTableOnly();
}
function clearSelection(){
  selection = null;
  updateToolbarState();
  renderSelectionHint();
  renderTableOnly();
}
function renderSelectionHint(){
  const el = document.getElementById('selHint');
  if(!el) return;
  if(!selection){ el.textContent='无'; return; }
  const aIdx = actions.findIndex(a=>a.id===selection.actionId);
  el.textContent = `动作#${aIdx>=0 ? (aIdx+1) : '?'} / 型号行#${selection.modelIdx+1}`;
}
function updateToolbarState(){
  const hasSel = !!selection && actions.some(a=>a.id===selection.actionId);
  const b1 = document.getElementById('btnAddModel');
  const b2 = document.getElementById('btnDelete');
  const b3 = document.getElementById('btnPhoto');
  if(b1) b1.disabled = !hasSel;
  if(b2) b2.disabled = !hasSel;
  if(b3) b3.disabled = !hasSel;
}

/** ==========================
 *  Page2：动作操作
 * ========================== */
function addAction(){
  actions.push(createEmptyAction());
  const a = actions[actions.length-1];
  setSelection(a.id, 0);
  render();
  toast('已新增动作（并选中第一行型号）');
  const lw=document.getElementById('listWrap');
  if(lw) lw.scrollTop = lw.scrollHeight;
}
function toggleSign(actionId){
  const a=actions.find(x=>x.id===actionId);
  if(!a) return;
  a.sign = a.sign===+1 ? -1 : +1;
  renderTableOnly();
}

/** +型号：加到选中动作末尾 */
function addModelToSelected(){
  if(!selection) return;
  const a=actions.find(x=>x.id===selection.actionId);
  if(!a) return;
  a.models.push(createEmptyModelRow());
  setSelection(a.id, a.models.length-1);
  toast('已新增一行型号');
}

/** 删除：以“型号行”为单位；若动作无型号则动作也删除 */
function deleteSelectedModel(){
  if(!selection) return;
  const aIdx = actions.findIndex(a=>a.id===selection.actionId);
  if(aIdx<0) return;
  const a = actions[aIdx];
  const mIdx = selection.modelIdx;

  const ok = confirm('确认删除选中的型号行？');
  if(!ok) return;

  if(mIdx>=0 && mIdx<a.models.length){
    a.models.splice(mIdx,1);
  }

  if(a.models.length===0){
    actions.splice(aIdx,1);
    toast('已删除型号行；该动作已无型号，动作一并删除');
    const next = actions[aIdx] || actions[aIdx-1];
    if(next) setSelection(next.id, 0);
    else clearSelection();
  }else{
    toast('已删除型号行');
    const newIdx = Math.min(mIdx, a.models.length-1);
    setSelection(a.id, newIdx);
  }

  render();
}

/** 型号输入绑定 */
function setModelField(actionId, idx, field, val){
  const a=actions.find(x=>x.id===actionId);
  if(!a || !a.models[idx]) return;
  a.models[idx][field]=val;
}

/** ==========================
 *  Page2：拍照/上传（作用于选中动作）
 * ========================== */
function pickPhotoForSelected(){
  if(!selection) return;
  const actionId = selection.actionId;
  const input=document.createElement('input');
  input.type='file';
  input.accept='image/*';
  input.capture='environment';
  input.onchange=()=>{
    const file=input.files && input.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      const a=actions.find(x=>x.id===actionId);
      if(!a) return;
      a.photos.push(reader.result);
      renderTableOnly();
      toast('照片已添加到该动作');
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

/** =======================
 *  Page2：表格渲染
 * ======================= */
function render(){
  renderTable();
  updateToolbarState();
  renderSelectionHint();
}
function renderTable(){
  const wrap=document.getElementById('listWrap');
  if(!wrap) return;
  wrap.innerHTML = tableTpl();
}
function renderTableOnly(){
  const wrap=document.getElementById('listWrap');
  if(!wrap) return;
  wrap.innerHTML = tableTpl();
}

function tableTpl(){
  const rows = [];
  actions.forEach((a, ai)=>{
    a.models.forEach((m, mi)=>{
      const isSel = selection && selection.actionId===a.id && selection.modelIdx===mi;
      rows.push(rowTpl(a, ai, m, mi, isSel));
    });
  });

  return `
    <div class="listWrap" style="overflow:auto; max-height:calc(100vh - 520px)">
      <table class="tableMinW">
        <thead>
          <tr>
            <th class="cellSign">±</th>
            <th class="cellAction">动作</th>
            <th style="width:320px">型号</th>
            <th style="width:90px">W</th>
            <th style="width:90px">L</th>
            <th style="width:90px">H</th>
            <th style="width:90px">F</th>
            <th style="width:420px">照片</th>
          </tr>
        </thead>
        <tbody>
          ${rows.length ? rows.join('') : `<tr><td colspan="8" class="muted" style="padding:16px">暂无记录</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

function rowTpl(a, ai, m, mi, isSel){
  const signCls = a.sign===+1 ? 'signBtn plus' : 'signBtn minus';
  const signTxt = a.sign===+1 ? '+' : '−';

  const photoStrip = a.photos.length
    ? `<div class="photoStrip">${a.photos.map((p,pi)=>thumbMiniTpl(a.id, pi, p)).join('')}</div>`
    : `<span class="muted small">暂无</span>`;

  return `
    <tr class="${isSel ? 'selected':''}" onclick="setSelection('${escAttr(a.id)}', ${mi})">
      <td class="cellSign" onclick="event.stopPropagation(); toggleSign('${escAttr(a.id)}')">
        <div class="${signCls}" title="点击切换 + / -">${signTxt}</div>
      </td>

      <td class="cellAction">#${ai+1}</td>

      <td><input value="${escAttr(m.model)}" placeholder="型号"
        oninput="setModelField('${escAttr(a.id)}', ${mi}, 'model', this.value)"
        onclick="event.stopPropagation(); setSelection('${escAttr(a.id)}', ${mi})"/></td>

      <td><input value="${escAttr(m.w)}" placeholder="W" inputmode="numeric"
        oninput="setModelField('${escAttr(a.id)}', ${mi}, 'w', this.value)"
        onclick="event.stopPropagation(); setSelection('${escAttr(a.id)}', ${mi})"/></td>

      <td><input value="${escAttr(m.l)}" placeholder="L" inputmode="numeric"
        oninput="setModelField('${escAttr(a.id)}', ${mi}, 'l', this.value)"
        onclick="event.stopPropagation(); setSelection('${escAttr(a.id)}', ${mi})"/></td>

      <td><input value="${escAttr(m.h)}" placeholder="H" inputmode="numeric"
        oninput="setModelField('${escAttr(a.id)}', ${mi}, 'h', this.value)"
        onclick="event.stopPropagation(); setSelection('${escAttr(a.id)}', ${mi})"/></td>

      <td><input value="${escAttr(m.f)}" placeholder="F" inputmode="numeric"
        oninput="setModelField('${escAttr(a.id)}', ${mi}, 'f', this.value)"
        onclick="event.stopPropagation(); setSelection('${escAttr(a.id)}', ${mi})"/></td>

      <td onclick="event.stopPropagation();">
        ${photoStrip}
      </td>
    </tr>
  `;
}

function thumbMiniTpl(actionId, photoIdx, dataUrl){
  return `
    <div class="thumbMini" title="点击预览" onclick="openViewer('${escAttr(actionId)}', ${photoIdx})">
      <img src="${escAttr(dataUrl)}" alt="p"/>
    </div>
  `;
}

/** =======================
 *  照片预览（支持左右滑动）
 * ======================= */
const viewerMask = document.getElementById('viewerMask');
const viewerImg  = document.getElementById('viewerImg');
const viewerMeta = document.getElementById('viewerMeta');

let viewerState = { actionId:null, idx:0, startX:null, startY:null };

function openViewer(actionId, idx){
  const a = actions.find(x=>x.id===actionId);
  if(!a || !a.photos.length) return;
  viewerState.actionId = actionId;
  viewerState.idx = Math.max(0, Math.min(idx, a.photos.length-1));
  viewerMask.style.display='flex';
  renderViewer();
}
function closeViewer(){
  viewerMask.style.display='none';
  viewerState.actionId=null;
  viewerState.idx=0;
}
function renderViewer(){
  const a = actions.find(x=>x.id===viewerState.actionId);
  if(!a || !a.photos.length){ closeViewer(); return; }
  viewerImg.src = a.photos[viewerState.idx];
  viewerMeta.textContent = `${viewerState.idx+1}/${a.photos.length}`;
}
function prevPhoto(){
  const a = actions.find(x=>x.id===viewerState.actionId);
  if(!a || !a.photos.length) return;
  viewerState.idx = (viewerState.idx - 1 + a.photos.length) % a.photos.length;
  renderViewer();
}
function nextPhoto(){
  const a = actions.find(x=>x.id===viewerState.actionId);
  if(!a || !a.photos.length) return;
  viewerState.idx = (viewerState.idx + 1) % a.photos.length;
  renderViewer();
}
function deleteViewedPhoto(){
  const a = actions.find(x=>x.id===viewerState.actionId);
  if(!a) return;
  const ok = confirm('确认删除当前照片？');
  if(!ok) return;

  a.photos.splice(viewerState.idx,1);

  if(a.photos.length===0){
    toast('照片已删除（该动作暂无照片）');
    closeViewer();
    renderTableOnly();
    return;
  }

  viewerState.idx = Math.min(viewerState.idx, a.photos.length-1);
  toast('照片已删除');
  renderViewer();
  renderTableOnly();
}

viewerMask.addEventListener('click', (e)=>{
  if(e.target===viewerMask) closeViewer();
});
viewerImg.addEventListener('click', ()=>closeViewer());

viewerImg.addEventListener('touchstart', (e)=>{
  const t=e.touches[0];
  viewerState.startX=t.clientX;
  viewerState.startY=t.clientY;
},{passive:true});

viewerImg.addEventListener('touchend', (e)=>{
  if(viewerState.startX==null) return;
  const t=e.changedTouches[0];
  const dx=t.clientX - viewerState.startX;
  const dy=t.clientY - viewerState.startY;
  viewerState.startX=null; viewerState.startY=null;

  if(Math.abs(dx) < 30) return;
  if(Math.abs(dx) < Math.abs(dy)) return;

  if(dx>0) prevPhoto();
  else nextPhoto();
},{passive:true});

/** =======================
 *  Toast
 * ======================= */
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.display='block';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.style.display='none';}, 1600);
}

/** =======================
 *  三件套（SLMS-ThreeKitStyle）
 * ======================= */
const kitMask = document.getElementById('kitMask');
const verBtn = document.getElementById('verBtn');

function verBtnInit(){
  verBtn.onclick = ()=>{ kitMask.style.display='flex'; showDoc('schema'); };
  kitMask.addEventListener('click', (e)=>{ if(e.target===kitMask) closeKit(); });
}
function closeKit(){ kitMask.style.display='none'; }

function setNavActive(which){
  ['schema','dict','ui'].forEach(k=>{
    const btn = document.getElementById('btn'+cap(k));
    if(btn) btn.classList.toggle('active', k===which);
  });
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function showDoc(which){
  setNavActive(which);
  const right = document.getElementById('docRight');
  const doc = DOCS[which];
  right.innerHTML = `
    <div class="docCard">
      <div class="docHd">
        <span class="name">${esc(doc.name)}</span>
        <button class="copyBtn" onclick="copyDoc('${escAttr(which)}')">复制</button>
      </div>
      <pre id="pre-${escAttr(which)}">${esc(doc.content)}</pre>
    </div>
  `;
}

function copyDoc(which){
  const pre = document.getElementById('pre-'+which);
  if(!pre) return;
  const text = pre.textContent || '';
  navigator.clipboard.writeText(text).then(()=>toast('已复制')).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    ta.remove();
    toast('已复制');
  });
}
